<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>

        body{
            margin: 0;
            padding: 0;
        }

        nav{
            background-color: black;
            padding: 10px;
        }

        ul{
            list-style: none;
            margin: 0;      
            padding: 0;
            text-align: center;
        }

        li{
            display: inline;
            margin:  15px;
        }

        a{
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
        }

        a:hover{
            background-color: orange;
            color: black;
        }

    </style>

</head>
<body>
<nav>

<ul>
<li><a href="#">About</a></li>
<li><a href="#">Admissions</a></li>
<li><a href="#">Academics</a></li>
<li><a href="#">Clubs</a></li>
<li><a href="#">Campus</a></li>
<li><a href="#">Placements</a></li>
<li><a href="#">Research</a></li>
<li><a href="#">Inquiery</a></li>
</ul>

    <img src="https://photodpshare.com/wp-content/uploads/2025/09/photos-for-whatsapp-attitude-style-dp.webp" alt="">

</div>
</nav>
</body>
</html>
